<!DOCTYPE html>
<html lang="de" id="html-tag">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <title data-i18n="page_title">Servify Legal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6C5CE7;
      --primary-light: #A29BFE;
      --primary-dark: #5A4BD1;
      --primary-glow: rgba(108, 92, 231, 0.3);
      --secondary: #00CEC9;
      --secondary-light: #55EFC4;
      --secondary-dark: #00B894;
      --accent: #FD79A8;
      --accent-warm: #E17055;
      --accent-gold: #FFEAA7;
      --bg-primary: #0F0E17;
      --bg-secondary: #141320;
      --bg-card: #1E1D2F;
      --bg-card-hover: #2A2942;
      --bg-glass: rgba(30, 29, 47, 0.7);
      --text-primary: #FFFFFE;
      --text-secondary: #B8B5C9;
      --text-muted: #7F7C99;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.3);
      --shadow-lg: 0 16px 64px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 40px var(--primary-glow);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-primary: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-primary);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: var(--primary-light); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--secondary-light); }

    ::selection { background: var(--primary); color: white; }

    /* ============================================
       LAYOUT
       ============================================ */
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    .section { padding: 120px 0 80px; position: relative; }
    
    .gradient-text {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary) 50%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ============================================
       NAVBAR
       ============================================ */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 12px 0; transition: all var(--transition);
      background: rgba(15, 14, 23, 0.9); backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }

    .navbar .nav-container {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .navbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.25rem; font-weight: 800; color: var(--text-primary);
    }

    .navbar-brand .logo-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .navbar-brand .logo-icon .material-icons-round { font-size: 1.15rem; color: white; }

    .nav-links { display: flex; align-items: center; gap: 4px; }

    .lang-switcher {
      display: flex; align-items: center; gap: 6px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; cursor: pointer; font-size: 0.82rem; font-weight: 600;
      color: var(--text-secondary); padding: 5px 11px;
      display: flex; align-items: center; gap: 5px;
      transition: all var(--transition);
    }
    .lang-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.12); }
    .lang-btn.active { color: white; border-color: var(--primary-light); background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 2px 10px var(--primary-glow); }

    /* ============================================
       CONTENT
       ============================================ */
    .legal-header { margin-bottom: 40px; text-align: center; margin-top: 60px; }
    .legal-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin-bottom: 16px; }
    .legal-last-updated { font-size: 0.9rem; color: var(--text-muted); }

    .legal-content {
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 40px;
      backdrop-filter: blur(16px);
      color: var(--text-secondary);
    }
    .legal-content h2 { font-size: 1.4rem; color: var(--text-primary); margin: 32px 0 16px; font-weight: 700; }
    .legal-content h3 { font-size: 1.1rem; color: var(--text-primary); margin: 24px 0 12px; font-weight: 600; }
    .legal-content p { margin-bottom: 16px; line-height: 1.7; }
    .legal-content ul { margin-bottom: 16px; padding-left: 20px; }
    .legal-content li { margin-bottom: 8px; }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .footer { text-align: center; padding: 40px 0; border-top: 1px solid var(--border); margin-top: 60px; color: var(--text-muted); font-size: 0.85rem; }

    @media (max-width: 768px) {
      .legal-content { padding: 24px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="https://servifysaas.com" class="navbar-brand">
        <div class="logo-icon">
          <span class="material-icons-round">restaurant_menu</span>
        </div>
        <span class="gradient-text">Servify</span>
      </a>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="de" title="Deutsch">🇩🇪 DE</button>
        <button class="lang-btn" data-lang="tr" title="Türkçe">🇹🇷 TR</button>
        <button class="lang-btn" data-lang="en" title="English">🇬🇧 EN</button>
      </div>
    </div>
  </nav>

  <div class="section container reveal">
    <div class="legal-header">
      <h1 class="legal-title gradient-text" data-i18n="page_title">Legal Title</h1>
      <div class="legal-last-updated" data-i18n="last_updated">Zuletzt aktualisiert: August 2026</div>
    </div>

    <div class="legal-content" data-i18n-html="content">
      Content here
    </div>
  </div>

  <footer class="footer">
    <p data-i18n="footer_copy">© 2026 Servify. Alle Rechte vorbehalten.</p>
  </footer>

  <script>
    const translations = {
      de: {
        page_title: "Rückerstattungsrichtlinie",
        last_updated: "Zuletzt aktualisiert: August 2026",
        footer_copy: "© 2026 Servify. Alle Rechte vorbehalten.",
        content: `
          <h2>1. 14-tägige kostenlose Testversion</h2>
          <p>Wir bieten eine risikofreie 14-tägige Testversion an. Während dieses Zeitraums werden Ihnen keine Kosten berechnet, und Sie können den Service jederzeit beenden.</p>
          
          <h2>2. 30-Tage-Geld-zurück-Garantie</h2>
          <p>Nach dem Kauf bieten wir eine 30-Tage-Geld-zurück-Garantie. Wenn Sie mit Servify nicht zufrieden sind, können Sie innerhalb von 30 Tagen nach dem Kaufdatum eine vollständige Rückerstattung verlangen.</p>

          <h2>3. Rückerstattungsprozess</h2>
          <p>Alle Rückerstattungen werden über unseren Zahlungspartner <strong>Klarna</strong> abgewickelt. Der erstattete Betrag wird der ursprünglichen Zahlungsmethode gutgeschrieben.</p>

          <h2>4. Keine Rückerstattung nach 30 Tagen</h2>
          <p>Nach Ablauf der ersten 30 Tage sind Abonnementgebühren nicht mehr erstattungsfähig.</p>

          <h2>5. So beantragen Sie eine Rückerstattung</h2>
          <p>Um eine Rückerstattung zu beantragen, senden Sie bitte eine E-Mail an <strong>info@servifysaas.com</strong> mit Ihren Kontodetails und dem Grund für die Stornierung.</p>

          <h2>6. Bearbeitungszeit</h2>
          <p>Die Bearbeitung von Rückerstattungen dauert in der Regel 5-10 Werktage, abhängig von Ihrer Bank und Klarna.</p>
        `
      },
      en: {
        page_title: "Refund Policy",
        last_updated: "Last updated: August 2026",
        footer_copy: "© 2026 Servify. All rights reserved.",
        content: `
          <h2>1. 14-Day Free Trial</h2>
          <p>We offer a risk-free 14-day trial. During this period, you will not be charged, and you can cancel the service at any time.</p>
          
          <h2>2. 30-Day Money-Back Guarantee</h2>
          <p>After purchase, we provide a 30-day money-back guarantee. If you are not satisfied with Servify, you can request a full refund within 30 days of the purchase date.</p>

          <h2>3. Refund Process</h2>
          <p>All refunds are processed through our payment partner, <strong>Klarna</strong>. The refunded amount will be credited back to your original payment method.</p>

          <h2>4. Non-Refundable After 30 Days</h2>
          <p>Once the initial 30 days have passed, subscription fees are non-refundable.</p>

          <h2>5. How to Request a Refund</h2>
          <p>To request a refund, please email us at <strong>info@servifysaas.com</strong> with your account details and the reason for cancellation.</p>

          <h2>6. Processing Time</h2>
          <p>Refunds typically take 5-10 business days to process, depending on your bank and Klarna.</p>
        `
      },
      tr: {
        page_title: "İade Politikası",
        last_updated: "Son güncelleme: Ağustos 2026",
        footer_copy: "© 2026 Servify. Tüm hakları saklıdır.",
        content: `
          <h2>1. 14 Günlük Ücretsiz Deneme</h2>
          <p>Risk içermeyen 14 günlük ücretsiz deneme sunuyoruz. Bu süre zarfında herhangi bir ücret ödemezsiniz ve hizmeti istediğiniz zaman iptal edebilirsiniz.</p>
          
          <h2>2. 30 Günlük Para İade Garantisi</h2>
          <p>Satın alma işleminden sonra 30 günlük para iade garantisi sunuyoruz. Servify'dan memnun kalmazsanız, satın alma tarihinden itibaren 30 gün içinde tam para iadesi talep edebilirsiniz.</p>

          <h2>3. İade Süreci</h2>
          <p>Tüm iadeler ödeme ortağımız <strong>Klarna</strong> aracılığıyla işlenir. İade edilen tutar, orijinal ödeme yönteminize geri yatırılacaktır.</p>

          <h2>4. 30 Günden Sonra İade Yapılmaz</h2>
          <p>İlk 30 gün geçtikten sonra abonelik ücretleri iade edilmez.</p>

          <h2>5. İade Nasıl Talep Edilir</h2>
          <p>İade talep etmek için lütfen hesap bilgilerinizi ve iptal nedeninizi belirten bir e-postayı <strong>info@servifysaas.com</strong> adresine gönderin.</p>

          <h2>6. İşlem Süresi</h2>
          <p>İadelerin işlenmesi bankanıza ve Klarna'ya bağlı olarak genellikle 5-10 iş günü sürer.</p>
        `
      }
    };
    
    function setLanguage(lang) {
      if (!translations[lang]) return;
      document.getElementById('html-tag').setAttribute('lang', lang);
      localStorage.setItem('appLang', lang);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const t = translations[lang];
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (t[key]) el.innerHTML = t[key];
      });
      
      document.title = t.page_title + " | Servify";
    }

    document.addEventListener('DOMContentLoaded', () => {
      let savedLang = localStorage.getItem('appLang') || 'de';
      if (!['de', 'tr', 'en'].includes(savedLang)) savedLang = 'de';
      setLanguage(savedLang);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          setLanguage(e.currentTarget.dataset.lang);
        });
      });
      
      setTimeout(() => document.querySelector('.reveal').classList.add('visible'), 100);
    });
  </script>
</body>
</html>
