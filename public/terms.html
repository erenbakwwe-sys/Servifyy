<!DOCTYPE html>
<html lang="de" id="html-tag">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <title data-i18n="page_title">Servify Legal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6C5CE7;
      --primary-light: #A29BFE;
      --primary-dark: #5A4BD1;
      --primary-glow: rgba(108, 92, 231, 0.3);
      --secondary: #00CEC9;
      --secondary-light: #55EFC4;
      --secondary-dark: #00B894;
      --accent: #FD79A8;
      --accent-warm: #E17055;
      --accent-gold: #FFEAA7;
      --bg-primary: #0F0E17;
      --bg-secondary: #141320;
      --bg-card: #1E1D2F;
      --bg-card-hover: #2A2942;
      --bg-glass: rgba(30, 29, 47, 0.7);
      --text-primary: #FFFFFE;
      --text-secondary: #B8B5C9;
      --text-muted: #7F7C99;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.3);
      --shadow-lg: 0 16px 64px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 40px var(--primary-glow);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-primary: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-primary);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: var(--primary-light); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--secondary-light); }

    ::selection { background: var(--primary); color: white; }

    /* ============================================
       LAYOUT
       ============================================ */
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    .section { padding: 120px 0 80px; position: relative; }
    
    .gradient-text {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary) 50%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ============================================
       NAVBAR
       ============================================ */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 12px 0; transition: all var(--transition);
      background: rgba(15, 14, 23, 0.9); backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }

    .navbar .nav-container {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .navbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.25rem; font-weight: 800; color: var(--text-primary);
    }

    .navbar-brand .logo-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .navbar-brand .logo-icon .material-icons-round { font-size: 1.15rem; color: white; }

    .nav-links { display: flex; align-items: center; gap: 4px; }

    .lang-switcher {
      display: flex; align-items: center; gap: 6px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; cursor: pointer; font-size: 0.82rem; font-weight: 600;
      color: var(--text-secondary); padding: 5px 11px;
      display: flex; align-items: center; gap: 5px;
      transition: all var(--transition);
    }
    .lang-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.12); }
    .lang-btn.active { color: white; border-color: var(--primary-light); background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 2px 10px var(--primary-glow); }

    /* ============================================
       CONTENT
       ============================================ */
    .legal-header { margin-bottom: 40px; text-align: center; margin-top: 60px; }
    .legal-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin-bottom: 16px; }
    .legal-last-updated { font-size: 0.9rem; color: var(--text-muted); }

    .legal-content {
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 40px;
      backdrop-filter: blur(16px);
      color: var(--text-secondary);
    }
    .legal-content h2 { font-size: 1.4rem; color: var(--text-primary); margin: 32px 0 16px; font-weight: 700; }
    .legal-content h3 { font-size: 1.1rem; color: var(--text-primary); margin: 24px 0 12px; font-weight: 600; }
    .legal-content p { margin-bottom: 16px; line-height: 1.7; }
    .legal-content ul { margin-bottom: 16px; padding-left: 20px; }
    .legal-content li { margin-bottom: 8px; }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .footer { text-align: center; padding: 40px 0; border-top: 1px solid var(--border); margin-top: 60px; color: var(--text-muted); font-size: 0.85rem; }

    @media (max-width: 768px) {
      .legal-content { padding: 24px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="https://servifysaas.com" class="navbar-brand">
        <div class="logo-icon">
          <span class="material-icons-round">restaurant_menu</span>
        </div>
        <span class="gradient-text">Servify</span>
      </a>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="de" title="Deutsch">🇩🇪 DE</button>
        <button class="lang-btn" data-lang="tr" title="Türkçe">🇹🇷 TR</button>
        <button class="lang-btn" data-lang="en" title="English">🇬🇧 EN</button>
      </div>
    </div>
  </nav>

  <div class="section container reveal">
    <div class="legal-header">
      <h1 class="legal-title gradient-text" data-i18n="page_title">Legal Title</h1>
      <div class="legal-last-updated" data-i18n="last_updated">Zuletzt aktualisiert: August 2026</div>
    </div>

    <div class="legal-content" data-i18n-html="content">
      Content here
    </div>
  </div>

  <footer class="footer">
    <p data-i18n="footer_copy">© 2026 Servify. Alle Rechte vorbehalten.</p>
  </footer>

  <script>

      de: {

        last_updated: "Zuletzt aktualisiert: August 2026",
        footer_copy: "© 2026 Servify. Alle Rechte vorbehalten.",
        content: `

          <ul>

          <h2>5. Datenverarbeitung</h2>

          <h2>6. Geistiges Eigentum</h2>

          <p>Servify haftet nicht für indirekte Schäden oder entgangenen Gewinn. Die Haftung ist auf den vom Kunden in den letzten 12 Monaten gezahlten Betrag beschränkt.</p>

          <h2>8. Kündigung</h2>
          <p>Abonnements können jederzeit zum Ende der aktuellen Laufzeit gekündigt werden.</p>

          <h2>9. Anwendbares Recht</h2>
          <p>Diese Bedingungen unterliegen dem Recht der Bundesrepublik Deutschland.</p>
        `
      },
      en: {
        page_title: "Terms of Service",
        last_updated: "Last updated: August 2026",
        footer_copy: "© 2026 Servify. All rights reserved.",
        content: `
          <h2>1. Introduction</h2>
          <p>Welcome to Servify (servifysaas.com). These Terms of Service govern your use of our QR code ordering and POS system for restaurants.</p>
          
          <h2>2. Service and Account</h2>
          <p>Users must create an account to use our services. You are responsible for maintaining the security of your credentials.</p>
          
          <h2>3. Subscription Plans and Payment</h2>
          <ul>
            <li><strong>Starter:</strong> €599/year</li>
            <li><strong>Professional:</strong> €1199/year</li>

          </ul>
          <p>Payments are processed securely via Klarna.</p>

          <h2>4. 14-Day Free Trial</h2>
          <p>We offer a 14-day free trial for new customers. No charges will be applied during this period.</p>

          <h2>5. Data Processing</h2>
          <p>We process personal data in accordance with our <a href="/privacy.html">Privacy Policy</a>.</p>

          <h2>6. Intellectual Property</h2>
          <p>All rights to the software, design, and content remain with Servify.</p>

          <h2>7. Limitation of Liability</h2>
          <p>Servify shall not be liable for indirect damages or lost profits. Liability is limited to the amount paid by the customer in the last 12 months.</p>

          <h2>8. Termination</h2>
          <p>Subscriptions can be canceled at any time, effective at the end of the current billing cycle.</p>

          <h2>9. Governing Law</h2>
          <p>These terms are governed by the laws of the Federal Republic of Germany.</p>
        `
      },
      tr: {
        page_title: "Kullanım Şartları",
        last_updated: "Son güncelleme: Ağustos 2026",
        footer_copy: "© 2026 Servify. Tüm hakları saklıdır.",
        content: `
          <h2>1. Giriş</h2>
          <p>Servify'a (servifysaas.com) hoş geldiniz. Bu Kullanım Şartları, restoranlar için QR kod sipariş ve POS sistemimizi kullanımınızı düzenler.</p>
          
          <h2>2. Hizmet ve Hesap</h2>
          <p>Hizmetlerimizi kullanmak için bir hesap oluşturmanız gerekmektedir. Giriş bilgilerinizin güvenliğinden siz sorumlusunuz.</p>
          
          <h2>3. Abonelik Planları ve Ödeme</h2>
          <ul>
            <li><strong>Starter (Başlangıç):</strong> €599/yıl</li>
            <li><strong>Professional (Profesyonel):</strong> €1199/yıl</li>
            <li><strong>Enterprise (Kurumsal):</strong> €1999/yıl</li>
          </ul>
          <p>Ödemeler Klarna aracılığıyla güvenli bir şekilde işlenir.</p>

          <h2>4. 14 Günlük Ücretsiz Deneme</h2>
          <p>Yeni müşteriler için 14 günlük ücretsiz deneme sunuyoruz. Bu süre zarfında herhangi bir ücret alınmayacaktır.</p>

          <h2>5. Veri İşleme</h2>
          <p>Kişisel verileri <a href="/privacy.html">Gizlilik Politikamız</a> uyarınca işleriz.</p>

          <h2>6. Fikri Mülkiyet</h2>
          <p>Yazılım, tasarım ve içeriğe ait tüm haklar Servify'da kalır.</p>

          <h2>7. Sorumluluğun Sınırlandırılması</h2>
          <p>Servify, dolaylı hasarlar veya kar kaybından sorumlu tutulamaz. Sorumluluk, müşterinin son 12 ayda ödediği miktar ile sınırlıdır.</p>

          <h2>8. Fesih</h2>
          <p>Abonelikler, mevcut fatura döngüsünün sonunda geçerli olmak üzere her zaman iptal edilebilir.</p>

          <h2>9. Geçerli Kanun</h2>
          <p>Bu şartlar, Almanya Federal Cumhuriyeti yasalarına tabidir.</p>
        `
      }
    };
    
    function setLanguage(lang) {
      if (!translations[lang]) return;
      document.getElementById('html-tag').setAttribute('lang', lang);
      localStorage.setItem('appLang', lang);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const t = translations[lang];
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (t[key]) el.innerHTML = t[key];
      });
      
      document.title = t.page_title + " | Servify";
    }

    document.addEventListener('DOMContentLoaded', () => {
      let savedLang = localStorage.getItem('appLang') || 'de';
      if (!['de', 'tr', 'en'].includes(savedLang)) savedLang = 'de';
      setLanguage(savedLang);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          setLanguage(e.currentTarget.dataset.lang);
        });
      });
      
      setTimeout(() => document.querySelector('.reveal').classList.add('visible'), 100);
    });
  </script>
</body>
</html>
