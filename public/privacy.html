<!DOCTYPE html>
<html lang="de" id="html-tag">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <title data-i18n="page_title">Servify Legal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6C5CE7;
      --primary-light: #A29BFE;
      --primary-dark: #5A4BD1;
      --primary-glow: rgba(108, 92, 231, 0.3);
      --secondary: #00CEC9;
      --secondary-light: #55EFC4;
      --secondary-dark: #00B894;
      --accent: #FD79A8;
      --accent-warm: #E17055;
      --accent-gold: #FFEAA7;
      --bg-primary: #0F0E17;
      --bg-secondary: #141320;
      --bg-card: #1E1D2F;
      --bg-card-hover: #2A2942;
      --bg-glass: rgba(30, 29, 47, 0.7);
      --text-primary: #FFFFFE;
      --text-secondary: #B8B5C9;
      --text-muted: #7F7C99;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.3);
      --shadow-lg: 0 16px 64px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 40px var(--primary-glow);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-primary: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-primary);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: var(--primary-light); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--secondary-light); }

    ::selection { background: var(--primary); color: white; }

    /* ============================================
       LAYOUT
       ============================================ */
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    .section { padding: 120px 0 80px; position: relative; }
    
    .gradient-text {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary) 50%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ============================================
       NAVBAR
       ============================================ */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 12px 0; transition: all var(--transition);
      background: rgba(15, 14, 23, 0.9); backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }

    .navbar .nav-container {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .navbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.25rem; font-weight: 800; color: var(--text-primary);
    }

    .navbar-brand .logo-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .navbar-brand .logo-icon .material-icons-round { font-size: 1.15rem; color: white; }

    .nav-links { display: flex; align-items: center; gap: 4px; }

    .lang-switcher {
      display: flex; align-items: center; gap: 8px; margin-right: 12px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.05); border: 2px solid transparent; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem; padding: 4px; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition); filter: grayscale(0.6) opacity(0.7);
    }
    .lang-btn:hover { filter: grayscale(0) opacity(1); transform: scale(1.1); background: rgba(255, 255, 255, 0.1); }
    .lang-btn.active { filter: grayscale(0) opacity(1); border-color: var(--primary-light); background: rgba(108, 92, 231, 0.15); box-shadow: 0 0 10px var(--primary-glow); }

    /* ============================================
       CONTENT
       ============================================ */
    .legal-header { margin-bottom: 40px; text-align: center; margin-top: 60px; }
    .legal-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin-bottom: 16px; }
    .legal-last-updated { font-size: 0.9rem; color: var(--text-muted); }

    .legal-content {
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 40px;
      backdrop-filter: blur(16px);
      color: var(--text-secondary);
    }
    .legal-content h2 { font-size: 1.4rem; color: var(--text-primary); margin: 32px 0 16px; font-weight: 700; }
    .legal-content h3 { font-size: 1.1rem; color: var(--text-primary); margin: 24px 0 12px; font-weight: 600; }
    .legal-content p { margin-bottom: 16px; line-height: 1.7; }
    .legal-content ul { margin-bottom: 16px; padding-left: 20px; }
    .legal-content li { margin-bottom: 8px; }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .footer { text-align: center; padding: 40px 0; border-top: 1px solid var(--border); margin-top: 60px; color: var(--text-muted); font-size: 0.85rem; }

    @media (max-width: 768px) {
      .legal-content { padding: 24px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="https://servifysaas.com" class="navbar-brand">
        <div class="logo-icon">
          <span class="material-icons-round">restaurant_menu</span>
        </div>
        <span class="gradient-text">Servify</span>
      </a>
      <div class="nav-links">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="de" title="Deutsch">🇩🇪</button>
          <button class="lang-btn" data-lang="tr" title="Türkçe">🇹🇷</button>
          <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="section container reveal">
    <div class="legal-header">
      <h1 class="legal-title gradient-text" data-i18n="page_title">Legal Title</h1>
      <div class="legal-last-updated" data-i18n="last_updated">Zuletzt aktualisiert: August 2026</div>
    </div>

    <div class="legal-content" data-i18n-html="content">
      Content here
    </div>
  </div>

  <footer class="footer">
    <p data-i18n="footer_copy">© 2026 Servify. Alle Rechte vorbehalten.</p>
  </footer>

  <script>
    const translations = {

        content: `

          <ul>

          <h2>6. Ihre Rechte</h2>

          <ul>

            <li>Recht auf Berichtigung</li>
            <li>Recht auf Löschung</li>

          <h2>7. Kontakt</h2>
          <p>Bei Fragen zum Datenschutz kontaktieren Sie uns bitte unter: <strong>info@servifysaas.com</strong></p>
        `
      },
      en: {
        page_title: "Privacy Policy",
        last_updated: "Last updated: August 2026",
        footer_copy: "© 2026 Servify. All rights reserved.",
        content: `
          <h2>1. Data Controller</h2>
          <p>The data controller for this website is Servify (info@servifysaas.com). We process data in compliance with the GDPR.</p>
          
          <h2>2. Data Collected</h2>
          <p>We collect and process the following data:</p>
          <ul>
            <li>Account Information (Name, email, phone number)</li>
            <li>Restaurant Data (Address, menu, settings)</li>
            <li>Order Data (Customer orders, transactions)</li>
            <li>Usage Analytics (Log data, IP addresses)</li>
          </ul>

          <h2>3. Third Parties</h2>
          <p>We share certain data with the following trusted third parties:</p>
          <ul>
            <li><strong>Firebase (Google):</strong> Hosting and database</li>
            <li><strong>Klarna:</strong> Payment processing</li>
            <li><strong>Google Analytics:</strong> Web analytics</li>
            <li><strong>Vercel:</strong> Frontend hosting</li>
          </ul>

          <h2>4. Cookie Policy</h2>
          <p>We use essential cookies for functionality (e.g., language selection) and analytics cookies to improve our services.</p>

          <h2>5. Data Retention</h2>
          <p>We retain your data as long as your account is active. Transactional data is stored for up to 10 years due to tax retention obligations.</p>

          <h2>6. Your Rights</h2>
          <p>Under the GDPR, you have the following rights:</p>
          <ul>
            <li>Right to Access</li>
            <li>Right to Rectification</li>
            <li>Right to Erasure</li>
            <li>Right to Data Portability</li>
          </ul>

          <h2>7. Contact</h2>
          <p>For any privacy-related questions, please contact us at: <strong>info@servifysaas.com</strong></p>
        `
      },
      tr: {
        page_title: "Gizlilik Politikası",
        last_updated: "Son güncelleme: Ağustos 2026",
        footer_copy: "© 2026 Servify. Tüm hakları saklıdır.",
        content: `
          <h2>1. Veri Sorumlusu</h2>
          <p>Bu web sitesi için veri sorumlusu Servify'dır (info@servifysaas.com). Verileri GDPR (Genel Veri Koruma Yönetmeliği) uyumlu olarak işliyoruz.</p>
          
          <h2>2. Toplanan Veriler</h2>
          <p>Aşağıdaki verileri topluyor ve işliyoruz:</p>
          <ul>
            <li>Hesap Bilgileri (İsim, e-posta, telefon numarası)</li>
            <li>Restoran Verileri (Adres, menü, ayarlar)</li>
            <li>Sipariş Verileri (Müşteri siparişleri, işlemler)</li>
            <li>Kullanım Analitikleri (Günlük verileri, IP adresleri)</li>
          </ul>

          <h2>3. Üçüncü Taraflar</h2>
          <p>Belirli verileri aşağıdaki güvenilir üçüncü taraflarla paylaşıyoruz:</p>
          <ul>
            <li><strong>Firebase (Google):</strong> Barındırma ve veritabanı</li>
            <li><strong>Klarna:</strong> Ödeme işleme</li>
            <li><strong>Google Analytics:</strong> Web analitiği</li>
            <li><strong>Vercel:</strong> Ön yüz (frontend) barındırma</li>
          </ul>

          <h2>4. Çerez (Cookie) Politikası</h2>
          <p>İşlevsellik (örn. dil seçimi) için temel çerezler ve hizmetlerimizi geliştirmek için analitik çerezleri kullanıyoruz.</p>

          <h2>5. Veri Saklama</h2>
          <p>Verilerinizi hesabınız aktif olduğu sürece saklıyoruz. İşlem verileri, vergi saklama yükümlülükleri nedeniyle 10 yıla kadar saklanmaktadır.</p>

          <h2>6. Haklarınız</h2>
          <p>GDPR kapsamında aşağıdaki haklara sahipsiniz:</p>
          <ul>
            <li>Erişim Hakkı</li>
            <li>Düzeltme Hakkı</li>
            <li>Silme Hakkı</li>
            <li>Veri Taşınabilirliği Hakkı</li>
          </ul>

          <h2>7. İletişim</h2>
          <p>Gizlilikle ilgili tüm sorularınız için bizimle şu adresten iletişime geçebilirsiniz: <strong>info@servifysaas.com</strong></p>
        `
      }
    };
    
    function setLanguage(lang) {
      if (!translations[lang]) return;
      document.getElementById('html-tag').setAttribute('lang', lang);
      localStorage.setItem('appLang', lang);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const t = translations[lang];
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (t[key]) el.innerHTML = t[key];
      });
      
      document.title = t.page_title + " | Servify";
    }

    document.addEventListener('DOMContentLoaded', () => {
      let savedLang = localStorage.getItem('appLang') || 'de';
      if (!['de', 'tr', 'en'].includes(savedLang)) savedLang = 'de';
      setLanguage(savedLang);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          setLanguage(e.currentTarget.dataset.lang);
        });
      });
      
      setTimeout(() => document.querySelector('.reveal').classList.add('visible'), 100);
    });
  </script>
</body>
</html>
